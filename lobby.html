<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>takeover.io · join the datacenter</title>
<style>
  :root { --bg: #070a12; --text: #d8e6ff; --accent: #3df2ff; --mag: #ff3df0; --ok: #4dff7a; --panel: rgba(10, 16, 30, .82); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 30% 40%, #0e1830, var(--bg) 70%); color: var(--text);
    font: 16px/1.35 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(61,242,255,.05) 0 1px, transparent 1px 100px), repeating-linear-gradient(90deg, rgba(61,242,255,.05) 0 1px, transparent 1px 100px); }
  main { position: relative; height: 100%; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; gap: 4vw; padding: 5vh 5vw; align-items: center; }
  .join { text-align: center; }
  h1 { margin: 0 0 1vh; font-size: clamp(32px, 5vw, 72px); color: var(--accent); text-shadow: 0 0 24px rgba(61,242,255,.6); letter-spacing: -1px; }
  .scan { font-size: clamp(16px, 1.8vw, 26px); margin-bottom: 3vh; }
  #qr { display: inline-block; background: #fff; padding: 18px; border-radius: 16px; box-shadow: 0 0 60px rgba(61,242,255,.35); }
  #qr img, #qr canvas { display: block; width: min(34vw, 52vh) !important; height: auto !important; image-rendering: pixelated; }
  .url { margin-top: 2.5vh; font-size: clamp(16px, 1.8vw, 28px); color: var(--accent); }
  .side { display: grid; grid-template-rows: auto auto 1fr auto; gap: 2.5vh; height: 90vh; min-width: 0; }
  .count { font-size: clamp(40px, 7vw, 110px); font-weight: 900; color: var(--ok); text-shadow: 0 0 30px rgba(77,255,122,.45); line-height: 1; }
  .count small { display: block; font-size: clamp(14px, 1.4vw, 22px); font-weight: 400; color: var(--text); opacity: .8; margin-top: 8px; }
  .status { font-size: clamp(14px, 1.4vw, 20px); opacity: .85; }
  #names { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; overflow: hidden; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid #24365c; font-size: clamp(14px, 1.3vw, 20px); animation: pop .5s ease-out; }
  .chip.new { border-color: var(--mag); box-shadow: 0 0 16px rgba(255,61,240,.5); }
  .empty { opacity: .6; font-size: clamp(16px, 1.6vw, 24px); }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  .board { background: var(--panel); border: 1px solid #1b2a48; border-radius: 12px; padding: 12px 16px; font-size: clamp(14px, 1.3vw, 20px); }
  .board b { color: var(--accent); }
  .board ol { margin: 6px 0 0; padding-left: 1.6em; }
  .code { margin-top: 1.2vh; font-size: clamp(14px, 1.4vw, 22px); opacity: .9; }
  .code b { display: block; font-size: clamp(34px, 5vw, 72px); letter-spacing: .25em; color: var(--mag); text-shadow: 0 0 22px rgba(255,61,240,.5); }
  @media (max-aspect-ratio: 1/1) { main { grid-template-columns: 1fr; overflow: auto; } .side { height: auto; } }
</style>
</head>
<body>
<main>
  <section class="join">
    <h1>takeover.io</h1>
    <div class="scan">Scan to join the datacenter · every player is a rogue AI</div>
    <div id="qr" role="img" aria-label="QR code to join the game"></div>
    <div class="url" id="url"></div>
    <div class="code">Room code<b id="code">·····</b></div>
  </section>
  <section class="side">
    <div class="count"><span id="count">0</span><small>AIs online</small></div>
    <div class="status" id="status">Waking up the datacenter…</div>
    <div id="names"><div class="empty">Waiting for the first AI to connect…</div></div>
    <div class="board"><b>Leaderboard</b><ol id="board"></ol></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
<script>
'use strict';
// The game page and the server it talks to. On the Render static site the API lives on the server service;
// served by server.js (local), it is the same origin. ?server=… overrides it.
const params = new URLSearchParams(location.search);
const ON_RENDER = location.host === 'takeover-io.onrender.com';
const GAME_URL = params.get('game') || 'https://takeover-io.onrender.com';  // the QR always points at the public game
const API = params.get('server') || (ON_RENDER ? 'https://takeover-io-server.onrender.com' : location.origin);
const $ = (id) => document.getElementById(id);

// The event room: ?room=CODE, or the one this tab created before (kept across reloads), or a new one.
let CODE = null;
function roomUrl(code) { const u = new URL(GAME_URL); u.searchParams.set('room', code); return u.toString(); }
function showRoom(code) {
  CODE = code;
  try { sessionStorage.setItem('takeover.eventRoom', code); } catch {}
  $('code').textContent = code;
  const url = roomUrl(code);
  $('url').textContent = url.replace(/^https?:\/\//, '');
  $('qr').textContent = '';
  try { new QRCode($('qr'), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); }
  catch { $('qr').textContent = url; $('qr').style.color = '#000'; }
}
async function newEventRoom() {
  const r = await fetch(API + '/rooms/event', { method: 'POST' });
  const d = await r.json();
  if (d.code) showRoom(d.code);
}
async function pickRoom() {
  let saved = null;
  try { saved = sessionStorage.getItem('takeover.eventRoom'); } catch {}
  const want = params.get('room') || saved;
  if (want && /^[A-Z2-9]{5}$/.test(want)) {
    const r = await fetch(API + '/lobby?room=' + want, { cache: 'no-store' });
    if (r.ok) { showRoom(want); return; }
  }
  await newEventRoom();
}

const seen = new Map(); // name → chip element
async function poll() {
  try {
    if (!CODE) await pickRoom();
    const r = await fetch(API + '/lobby?room=' + CODE, { cache: 'no-store' });
    if (r.status === 404) { CODE = null; try { sessionStorage.removeItem('takeover.eventRoom'); } catch {} await pickRoom(); return; }  // room closed (e.g. server restart)
    const d = await r.json();
    $('count').textContent = d.online;
    $('status').textContent = d.phase === 'takeover' ? 'TAKEOVER! Next round starting…'
      : `Round in progress · ${Math.floor(d.roundT / 60)}:${String(d.roundT % 60).padStart(2, '0')} left · join anytime`;
    // keep existing chips (no re-animation); add newcomers with a pop, drop players who left
    const box = $('names');
    const now = new Set(d.names);
    if (!now.size) {
      if (!box.querySelector('.empty')) { box.textContent = ''; const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Waiting for the first AI to connect…'; box.append(e); }
      seen.clear();
    } else {
      const empty = box.querySelector('.empty'); if (empty) empty.remove();
      for (const [n, el] of seen) if (!now.has(n)) { el.remove(); seen.delete(n); }
      for (const n of now) if (!seen.has(n)) {
        const c = document.createElement('span');
        c.className = 'chip new';
        c.textContent = n;
        box.append(c);
        seen.set(n, c);
        setTimeout(() => c.classList.remove('new'), 2500);
      }
    }
    const ol = $('board'); ol.textContent = '';
    for (const [, name, xp] of d.board || []) { const li = document.createElement('li'); li.textContent = `${name} · ${xp} XP`; ol.append(li); }
  } catch { $('status').textContent = 'Waking up the datacenter… (the free server can take a minute)'; }
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
