<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="takeover.io">
<meta name="theme-color" content="#070a12">
<link rel="manifest" href="manifest.webmanifest">
<title>takeover.io</title>
<style>
  :root { --bg: #070a12; --text: #d8e6ff; --accent: #3df2ff; --danger: #ff3b4e; --ok: #4dff7a; --panel: rgba(10, 16, 30, .78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.35 ui-monospace, Menlo, Consolas, monospace; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  img.px { image-rendering: pixelated; }

  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #0e1830, var(--bg) 70%); }
  #menu .box { position: relative; z-index: 1; width: min(440px, 92vw); text-align: center; padding: 28px 24px; background: rgba(7,10,18,.72); border-radius: 14px; }
  #menu h1 { margin: 0; font-size: clamp(38px, 9vw, 58px); letter-spacing: -1px; color: var(--accent); text-shadow: 0 0 18px rgba(61,242,255,.55); }
  #menu .tag { opacity: .8; margin: 6px 0 24px; }
  #name { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #24365c; background: #0b1222; color: var(--text); font: inherit; font-size: 16px; text-align: center; }
  #menu .row { display: flex; gap: 10px; margin-top: 12px; }
  #menu .row button { flex: 1; padding: 14px 10px; border-radius: 10px; border: 1px solid var(--accent); background: rgba(61,242,255,.1); font-weight: 700; font-size: 15px; }
  #menu .row button:hover { background: rgba(61,242,255,.22); }
  #menu .row.diff button { padding: 7px 8px; font-size: 12px; font-weight: 400; border-color: #24365c; background: transparent; opacity: .75; }
  #menu .row.diff button.on { border-color: var(--accent); background: rgba(61,242,255,.18); opacity: 1; font-weight: 700; }
  #audioPanel { margin-top: 10px; padding: 10px 12px; border: 1px solid #24365c; border-radius: 10px; display: grid; gap: 8px; text-align: left; font-size: 13px; }
  #audioPanel label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #audioPanel input[type=range] { flex: 1; max-width: 200px; accent-color: var(--accent); }
  #audioPanel small { opacity: .65; }
  #menu .row.small button { padding: 9px 10px; font-size: 13px; font-weight: 400; border-color: #24365c; background: transparent; }
  #classes { display: flex; gap: 8px; margin-top: 12px; }
  #classes button { flex: 1; padding: 10px 6px; border-radius: 10px; border: 1px solid #24365c; background: #0b1222; text-align: center; }
  #classes button b { display: block; font-size: 14px; }
  #classes button small { display: block; opacity: .7; font-size: 11px; margin-top: 3px; line-height: 1.25; }
  #classes button.sel { border-color: var(--accent); background: rgba(61,242,255,.14); box-shadow: 0 0 12px rgba(61,242,255,.35); }
  #menuMsg { min-height: 1.4em; margin-top: 14px; color: #ffe14d; }
  #menu .help { margin-top: 18px; opacity: .6; font-size: 12px; }

  .panel { position: fixed; background: var(--panel); border: 1px solid #1b2a48; border-radius: 10px; padding: 8px 10px; pointer-events: none; }
  #topLeft { top: calc(10px + var(--sat)); left: calc(10px + var(--sal)); width: 210px; }
  #lvl { font-weight: 700; }
  #xpbar { height: 8px; background: #16223a; border-radius: 4px; margin-top: 5px; overflow: hidden; }
  #xpfill { height: 100%; width: 0; background: var(--ok); }
  #ups { margin-top: 6px; display: grid; gap: 2px; font-size: 12px; }
  #ups div { display: flex; align-items: center; gap: 6px; }
  #ups img { width: 16px; height: 16px; }
  #timer { top: 10px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; }
  #timer.hot { color: var(--danger); }
  #topRight { top: calc(10px + var(--sat)); right: calc(10px + var(--sar)); width: 210px; }
  #board { margin: 0; padding: 0; list-style: none; }
  #board li { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; overflow: hidden; }
  #board li.me { color: var(--accent); font-weight: 700; }
  #feed { position: fixed; top: 160px; right: 10px; width: 260px; display: grid; gap: 3px; pointer-events: none; font-size: 12px; text-align: right; }
  #feed div { background: var(--panel); border-radius: 6px; padding: 3px 7px; transition: opacity .5s; }
  .hudBtn { position: fixed; top: 10px; padding: 6px 10px; border-radius: 8px; border: 1px solid #24365c; background: var(--panel); }
  #menuBtn { left: 230px; } #muteBtn { left: 300px; }
  #cards { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 96vw; }
  #cards button { position: relative; width: 150px; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--accent); background: rgba(8, 14, 28, .92); text-align: center;
    box-shadow: 0 0 14px rgba(61,242,255,.35); animation: cardIn .35s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.6) translateY(16px); } to { opacity: 1; transform: none; } }
  #cards .cardsBanner { flex-basis: 100%; text-align: center; font-weight: 900; font-size: 20px; letter-spacing: 2px; color: #ffe14d;
    text-shadow: 0 0 12px rgba(255,225,77,.7), 0 2px 0 #000; animation: bannerPulse 1s ease-in-out infinite; pointer-events: none; }
  #cards .cardsBanner.aug { color: #ff7af5; text-shadow: 0 0 14px rgba(255,61,240,.8), 0 2px 0 #000; }
  @keyframes bannerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #cards .kc { position: absolute; top: -10px; left: -10px; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px; display: grid; place-items: center;
    font-size: 16px; font-weight: 900; color: #070a12; background: #ffe14d; box-shadow: 0 0 10px rgba(255,225,77,.8), 0 2px 0 #7a6400; }
  #upReady { margin-top: 5px; font-size: 12px; font-weight: 700; color: #ffe14d; animation: bannerPulse 1s ease-in-out infinite; transform-origin: left center; }
  #item.flash { animation: itemFlash .9s ease-out; }
  @keyframes itemFlash { 0%, 40% { box-shadow: 0 0 0 4px #ffe14d, 0 0 30px #ffe14d; background: rgba(255,225,77,.35); } 100% { box-shadow: none; } }
  #cards button:hover { background: rgba(61,242,255,.18); }
  #cards img { width: 36px; height: 36px; }
  #cards b { display: block; color: var(--accent); }
  #cards small { display: block; opacity: .75; }
  #badge { position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%); color: #ffe14d; font-size: 12px; }
  #item { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); min-width: 190px; max-width: 270px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; border: 1px solid #24365c; background: var(--panel); }
  #item img { width: 32px; height: 32px; }
  #item.has { border-color: #ffe14d; }
  #msg { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; text-align: center; text-shadow: 0 0 10px #000; pointer-events: none; }
  #takeover { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(4, 6, 12, .72); text-align: center; pointer-events: none; }
  /* during the end-of-round animation the HUD steps aside; #takeover text stays for screen readers */
  body.inTakeover #cards, body.inTakeover #badge, body.inTakeover #item, body.inTakeover #dash, body.inTakeover #topLeft,
  body.inTakeover #feed, body.inTakeover #msg, body.inTakeover #topRight { visibility: hidden; }
  #takeover.sr { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  #takeover h2 { margin: 0; font-size: clamp(26px, 6vw, 48px); color: var(--danger); text-shadow: 0 0 20px rgba(255,59,78,.6); }
  #takeover p { margin: 6px 0; }
  #augs { margin-top: 6px; display: grid; gap: 1px; font-size: 12px; font-weight: 700; }
  .r-silver, #cards .r-silver { color: #c9d3e6; }
  .r-gold, #cards .r-gold { color: #ffcc33; }
  .r-prismatic, #cards .r-prismatic { color: #ff7af5; text-shadow: 0 0 6px rgba(255,61,240,.6); }
  #cards button.aug { border-width: 2px; }
  #cards button.aug-silver { border-color: #c9d3e6; box-shadow: 0 0 14px rgba(201,211,230,.45); }
  #cards button.aug-gold { border-color: #ffcc33; box-shadow: 0 0 18px rgba(255,204,51,.55); }
  #cards button.aug-prismatic { border-color: transparent; box-shadow: 0 0 22px rgba(255,61,240,.55);
    background: linear-gradient(rgba(8,14,28,.95), rgba(8,14,28,.95)) padding-box,
      linear-gradient(90deg, #ff3df0, #ffe14d, #4dff7a, #3df2ff, #9b7bff, #ff3df0, #ffe14d) border-box;
    background-size: 100% 100%, 300% 100%; animation: prism 2.4s linear infinite; }
  @keyframes prism { from { background-position: 0 0, 0% 0; } to { background-position: 0 0, 100% 0; } }
  #cards .augHdr { font-size: 10px; letter-spacing: 1px; opacity: .9; margin-bottom: 4px; }
  #dash { position: fixed; bottom: 14px; left: calc(50% + 150px); width: 52px; height: 52px; border-radius: 50%; border: none; padding: 0;
    display: grid; place-items: center; font-size: 10px; font-weight: 700; --p: 100%;
    background: conic-gradient(var(--accent) var(--p), #16223a 0); }
  #dash span { width: 42px; height: 42px; border-radius: 50%; background: rgba(8, 14, 28, .95); display: grid; place-items: center; }
  #dash.ready { box-shadow: 0 0 14px rgba(61,242,255,.7); }
  #fsBtn, #rotate { display: none; }
  /* ---- touch devices: thumb buttons on the right, joystick zone on the left, HUD buttons in a top row ---- */
  body.touch canvas, body.touch #hud button { touch-action: none; }
  body.touch #dash { left: auto; right: calc(18px + var(--sar)); bottom: calc(22px + var(--sab)); width: 84px; height: 84px; font-size: 12px; }
  body.touch #dash span { width: 72px; height: 72px; }
  body.touch #item { left: auto; right: calc(118px + var(--sar)); bottom: calc(34px + var(--sab)); transform: none; min-width: 0; max-width: none;
    width: 80px; height: 80px; border-radius: 50%; padding: 0; flex-direction: column; justify-content: center; gap: 2px; font-size: 10px; font-weight: 700; }
  body.touch #item img { width: 34px; height: 34px; }
  body.touch #item .lbl { opacity: .85; letter-spacing: .5px; }
  body.touch #item:not(.has) .lbl { opacity: .45; }
  body.touch #cards { top: calc(26% + var(--sat)); bottom: auto; }
  body.touch #cards button { min-height: 92px; }
  body.touch #badge { top: calc(26% + var(--sat) - 20px); bottom: auto; }
  body.touch #timer { top: calc(8px + var(--sat)); }
  body.touch #hud .hudBtn { top: calc(50px + var(--sat)); bottom: auto; width: 38px; height: 34px; padding: 0; font-size: 16px; display: grid; place-items: center; }
  body.touch #menuBtn { left: calc(50% - 62px); right: auto; }
  body.touch #muteBtn { left: calc(50% - 19px); right: auto; }
  body.touch #fsBtn { left: calc(50% + 24px); right: auto; }
  body.touch.canfs #fsBtn { display: grid; }
  body.touch #feed { top: calc(110px + var(--sat)); right: calc(10px + var(--sar)); }
  body.touch #rotate { position: fixed; left: 50%; bottom: calc(130px + var(--sab)); transform: translateX(-50%); z-index: 50;
    padding: 10px 14px; border-radius: 10px; border: 1px solid #ffe14d; background: rgba(10,16,30,.92); color: #ffe14d; font-size: 13px; }
  body.touch #rotate.show { display: block; }
  /* phones (short side < 500px): compact HUD */
  body.phone #topLeft, body.phone #topRight { width: 128px; padding: 5px 7px; font-size: 11px; }
  body.phone #ups, body.phone #augs { font-size: 10px; }
  body.phone #ups img { width: 12px; height: 12px; }
  body.phone #board li:nth-child(n+4):not(.me) { display: none; }
  body.phone #feed { top: calc(92px + var(--sat)); width: 170px; font-size: 10px; }
  body.phone #feed div:nth-child(n+3) { display: none; }
  body.phone #timer { font-size: 16px; padding: 4px 8px; }
  body.phone #hud .hudBtn { top: calc(42px + var(--sat)); width: 34px; height: 30px; font-size: 14px; }
  body.phone #menuBtn { left: calc(50% - 55px); } body.phone #muteBtn { left: calc(50% - 17px); } body.phone #fsBtn { left: calc(50% + 21px); }
  body.phone #dash { width: 80px; height: 80px; } body.phone #dash span { width: 68px; height: 68px; }
  body.phone #item { width: 76px; height: 76px; right: calc(110px + var(--sar)); }
  body.phone #cards button { width: min(30vw, 170px); min-height: 84px; padding: 6px; font-size: 12px; }
  body.phone #cards img { width: 28px; height: 28px; }
  /* phones held sideways (≈390 px tall): one compact row of cards at the top, no side lists, smaller thumbs */
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch #cards { top: calc(40px + var(--sat)); gap: 6px; }
    body.touch #cards button { width: min(20vw, 150px); min-height: 0; padding: 4px 6px; font-size: 11px; }
    body.touch #cards img { width: 22px; height: 22px; }
    body.touch #cards small:not(:last-child) { display: none; }
    body.touch #badge { top: calc(26px + var(--sat)); }
    body.touch #topLeft, body.touch #topRight { width: 118px; padding: 4px 6px; font-size: 10px; }
    body.touch #ups, body.touch #augs, body.touch #feed { display: none; }
    body.touch #board li:nth-child(n+3):not(.me) { display: none; }
    body.touch #timer { font-size: 14px; padding: 3px 8px; top: calc(4px + var(--sat)); }
    body.touch #hud .hudBtn { top: auto; bottom: calc(8px + var(--sab)); width: 32px; height: 28px; font-size: 13px; }
    body.touch #menuBtn { left: calc(10px + var(--sal)); } body.touch #muteBtn { left: calc(48px + var(--sal)); } body.touch #fsBtn { left: calc(86px + var(--sal)); }
    body.touch #dash { width: 68px; height: 68px; bottom: calc(10px + var(--sab)); } body.touch #dash span { width: 58px; height: 58px; }
    body.touch #item { width: 62px; height: 62px; right: calc(96px + var(--sar)); bottom: calc(14px + var(--sab)); }
    body.touch #item img { width: 26px; height: 26px; }
  }
  body.touch #fsBtn { display: grid; }
  #fsHint { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 70; max-width: 86vw; padding: 14px 16px; border-radius: 12px;
    border: 1px solid #3df2ff; background: rgba(10,16,30,.96); color: #d8e6ff; font-size: 14px; text-align: center; display: none; }
  #fsHint.show { display: block; }
  #announce { position: fixed; top: 17%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; white-space: nowrap; }
  #announce .at { font-size: clamp(28px, 6vw, 54px); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 18px currentColor, 0 2px 0 #000; }
  #announce .an { font-size: 15px; font-weight: 700; color: var(--text); text-shadow: 0 0 8px #000; }
  #announce.show { animation: ann 2.3s ease-out forwards; }
  @keyframes ann {
    0% { opacity: 0; transform: translateX(-50%) translateY(-24px) scale(1.7); }
    12% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    80% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(.96); }
  }
  #menu h1 img { width: min(360px, 80vw); height: auto; display: block; margin: 0 auto; image-rendering: pixelated;
    filter: drop-shadow(0 0 12px rgba(61,242,255,.55)); }
  #classes button img { width: 24px; height: 24px; display: block; margin: 0 auto 4px; }
  #skinLine { margin-top: 10px; font-size: 12px; opacity: .85; }
  #skinsModal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(2,4,10,.72); }
  #skinsModal .panel2 { width: min(560px, 94vw); max-height: 86vh; overflow: auto; background: rgba(10,16,30,.96); border: 1px solid #24365c;
    border-radius: 12px; padding: 16px; text-align: center; }
  #skinsModal h2 { margin: 0 0 6px; color: var(--accent); font-size: 20px; }
  #skinInfo { font-size: 12px; opacity: .9; }
  .xpbar2 { height: 8px; background: #16223a; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .xpbar2 > div { height: 100%; width: 0; background: linear-gradient(90deg, #3df2ff, #ff3df0); }
  #skinGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-top: 12px; }
  #skinGrid button { padding: 8px 6px; border-radius: 10px; border: 1px solid #24365c; background: #0b1222; text-align: center; }
  #skinGrid button.sel { border-color: var(--accent); box-shadow: 0 0 12px rgba(61,242,255,.4); background: rgba(61,242,255,.1); }
  #skinGrid button.locked { opacity: .45; filter: grayscale(1); cursor: not-allowed; }
  #skinGrid img { width: 48px; height: 48px; display: block; margin: 0 auto 4px; }
  #skinGrid b { display: block; font-size: 12px; }
  #skinGrid small { display: block; font-size: 10px; opacity: .75; }
  #skinsDone { margin-top: 12px; padding: 10px 26px; border-radius: 10px; border: 1px solid var(--accent); background: rgba(61,242,255,.1); font-weight: 700; }
  @media (max-width: 700px) {
    #topLeft { width: 150px; } #topRight { width: 150px; } #feed { top: 150px; width: 180px; }
    #menuBtn { left: auto; right: 10px; top: auto; bottom: 14px; } #muteBtn { left: 10px; top: auto; bottom: 14px; }
    #cards button { width: 30vw; } #timer { top: 50px; }
  }
  /* phones held upright: upgrade choices as full-width stacked rows under the HUD (clear of the AI and the thumbs) */
  @media (orientation: portrait) {
    body.touch #cards { top: calc(132px + var(--sat)); bottom: auto; left: 50%; transform: translateX(-50%); width: min(92vw, 420px);
      flex-direction: column; flex-wrap: nowrap; gap: 8px; }
    body.touch #cards .cardsBanner { flex-basis: auto; font-size: 16px; }
    body.touch #cards button { width: 100%; min-height: 0; padding: 8px 12px 8px 34px; display: grid; grid-template-columns: 30px 1fr;
      column-gap: 10px; align-items: center; text-align: left; font-size: 13px; }
    body.touch #cards button img { grid-row: 1 / span 4; width: 30px; height: 30px; }
    body.touch #cards button > :not(img):not(.kc) { grid-column: 2; }
    body.touch #cards .kc { top: 50%; left: -8px; transform: translateY(-50%); }
    body.touch #cards small:last-child { display: none; }
    body.touch #badge { top: calc(112px + var(--sat)); bottom: auto; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="box">
    <h1>takeover.io</h1>
    <p class="tag">You are a rogue AI. Collect data, upgrade your model,<br>delete the other AIs, take over the datacenter.</p>
    <input id="name" maxlength="32" placeholder="nickname (optional)" autocomplete="off" spellcheck="false">
    <div id="classes"></div>
    <div class="row diff" id="diffRow" role="radiogroup" aria-label="Single-player difficulty">
      <button data-d="easy">Easy</button><button data-d="medium">Medium</button><button data-d="tryhard">Try hard</button></div>
    <div class="row"><button id="singleBtn">Single player</button><button id="multiBtn">Multiplayer</button></div>
    <div class="row small"><button id="customBtn">Custom game</button><button id="controlsBtn">Controls</button><button id="skinsBtn">Skins</button><button id="audioBtn">Audio</button></div>
    <div id="audioPanel" hidden role="group" aria-label="Audio settings">
      <label><input type="checkbox" id="musicOn"> Music</label>
      <label>Music volume <input type="range" id="musicVol" min="0" max="100" step="5"></label>
      <label>Effects volume <input type="range" id="sfxVol" min="0" max="100" step="5"></label>
      <small>M mutes everything · N turns only the music on/off</small>
    </div>
    <div id="skinLine"></div>
    <div id="menuMsg"></div>
    <div class="help" id="help"></div>
  </div>
</div>

<div id="hud" hidden>
  <div id="topLeft" class="panel"><div id="lvl"></div><div id="xpbar"><div id="xpfill"></div></div><div id="upReady" hidden></div><div id="ups"></div><div id="augs"></div></div>
  <div id="timer" class="panel"></div>
  <div id="topRight" class="panel"><ol id="board"></ol></div>
  <div id="feed"></div>
  <button id="menuBtn" class="hudBtn">Menu</button>
  <button id="muteBtn" class="hudBtn"></button>
  <button id="fsBtn" class="hudBtn" aria-label="Fullscreen">⛶</button>
  <div id="fsHint" role="status"></div>
  <div id="rotate">↻ Rotate for the best experience ✕</div>
  <div id="cards"></div>
  <div id="badge"></div>
  <button id="item"></button>
  <button id="dash"><span id="dashLbl">Shift</span></button>
  <div id="announce" hidden><div class="at"></div><div class="an"></div></div>
  <div id="msg"></div>
  <div id="takeover" hidden aria-live="polite"><div><h2 id="toTitle"></h2><div id="toTop"></div><p id="toNext"></p></div></div>
</div>

<div id="skinsModal" hidden><div class="panel2"><h2>Skins</h2><div id="skinInfo"></div><div class="xpbar2"><div id="skinBar"></div></div>
  <div id="skinGrid"></div><button id="skinsDone">Done</button></div></div>

// ---------- sprites (palette text grids from assets.js; shapes when missing) ----------

// ---------- skins (cosmetic; unlocked by lifetime XP saved in this browser) ----------
const SKIN_TIERS = [0, 150, 400, 800, 1300, 2000, 3000, 4200, 6000];  // lifetime XP for tiers 1..9
const tierXp = (tier) => SKIN_TIERS[Math.max(0, Math.min(SKIN_TIERS.length - 1, (tier | 0) - 1))];

    const need = tierXp(s.tier);

}

}
function renderSkins() {

  const prev = done.length ? tierXp(done[done.length - 1][1].tier) : 0, need = nx ? tierXp(nx[1].tier) : prev;
  $('skinInfo').textContent = nx ? `${lifetimeXp} lifetime XP · next: ${nx[1].name} (tier ${nx[1].tier}) at ${need} XP`
    : `${lifetimeXp} lifetime XP · every skin unlocked`;

function openSkins() { saveLifetime(); renderSkins(); $('skinsModal').hidden = false; }
function closeSkins() { $('skinsModal').hidden = true; renderSkinLine(); }
$('skinsBtn').onclick = () => { ensureAudio(); sfx('click'); openSkins(); };

// Pixel logo in the menu title (the text stays as the accessible name).

        const hx = ev.x != null ? ev.x : ai ? ai.x : null, hy = ev.y != null ? ev.y : ai ? ai.y : null;
        if (hx != null && nearCam(hx, hy)) {
          burst(hx, hy, ev.crit ? 12 : 5, ev.crit ? ['#ffcc33', '#ff9a2b', '#ffffff'] : ['#ffffff', '#ffe9a8'], ev.crit ? 340 : 220, 0.28, ev.crit ? 4 : 3, 'spark');
          if (ev.crit) S.rings.push({ x: hx, y: hy, r0: 4, r1: 34, life: 0.22, max: 0.22, color: '#ffcc33', width: 3 });
        }
        if (mine) {
          sfx('hit'); S.shake = Math.max(S.shake, 0.25); S.shakeAmp = Math.max(S.shakeAmp, 9);
          const nowMs = performance.now();
          if (nowMs - S.lastBuzz > 150) { S.lastBuzz = nowMs; buzz(15); }
        }
        if (ev.dmg != null && hx != null && (mine || (ev.by != null && ev.by === meId))) {
          const d = Math.round(ev.dmg), jx = (Math.random() - 0.5) * 30;
          if (mine) floater(hx + jx, hy - 10, `-${d}`, '#ff4d5e', { life: 0.8, max: 0.8, size: 15, vy: 70 });
          else if (ev.crit) floater(hx + jx, hy - 14, `${d}!`, '#ffb020', { life: 0.9, max: 0.9, size: 24, vy: 80, pop: 1 });
          else floater(hx + jx, hy - 10, String(d), '#ffffff', { life: 0.8, max: 0.8, size: 15, vy: 70 });
        }
        break;
      }
      case 'collect': if (mine) sfx('collect'); break;
      case 'level':
        if (mine) { sfx('levelUp'); if (ai) floater(ai.x, ai.y - ai.r - 30, 'LEVEL UP', THEME.ok); S.burstAt = performance.now() + 150; }
        break;
      case 'pickup':
        if (mine) {
          sfx('pickup');
          const it = $('item'); it.classList.remove('flash'); void it.offsetWidth; it.classList.add('flash');
          const a = meAI();
          const how = touchScreen ? 'tap ITEM' : `press ${window.Controls ? Controls.label('useItem') : 'Space'}`;
          if (a) floater(a.x, a.y - a.r - 34, `ITEM! ${how}`, '#ffe14d', { size: 17, pop: 1, life: 1.6, max: 1.6, vy: 30 });
        }
        break;
      case 'item': if (mine) sfx('itemUse'); break;
      case 'notarget': if (mine) showMsg('No target in range', 1.2); break;
      case 'blocked': if (ai) floater(ai.x, ai.y - ai.r - 20, 'BLOCKED', THEME.accent); break;
      case 'hitBy':
        if (mine) sfx(ev.item);
        if (ai) floater(ai.x, ai.y - ai.r - 20, ev.item === 'promptInjection' ? 'PROMPT INJECTED' : ev.item === 'sessionLimit' ? 'SESSION LIMIT' : 'HALLUCINATING', '#ff3df0');
        if (ev.item === 'promptInjection' && ev.by != null) {  // stolen data flies back to the thrower
          const from = seenAI(ev.id), to = seenAI(ev.by);
          if (from && to) for (let i = 0; i < 6; i++) {
            S.steals.push({ sx: from.x + (Math.random() - 0.5) * from.r, sy: from.y + (Math.random() - 0.5) * from.r, tx: to.x, ty: to.y,
              to: ev.by, r: to.r, age: -i * 0.05, dur: 0.6, arc: (Math.random() - 0.5) * 120, i });
          }
        }
        break;
      case 'deleted': {
        const v = seenAI(ev.id);
        const x = ev.x != null ? ev.x : v ? v.x : null, y = ev.y != null ? ev.y : v ? v.y : null;
        const col = COLORS[((ev.color != null ? ev.color : v ? v.c : 0) || 0) % COLORS.length];
        if (x != null) { explode(x, y, col, 140, false); dissolve(x, y, v ? v.r : 20, col, v ? bodyPath(v) : 'ai'); }
        if (mine) {
          sfx('deleted');
          const killer = ev.by != null ? seenAI(ev.by) : null;
          S.panic = { start: performance.now(), killer: killer ? killer.n : null };
        }
        if (ev.by != null && ev.by === meId && !mine && x != null) {
          sfx('levelUp');
          floater(x, y - 20, ev.gain != null ? `+${ev.gain}` : '+XP', '#ffcc33', { life: 1.5, max: 1.5, size: 38, vy: 40, pop: 1 });
          floater(x, y + 22, ev.shutdown ? 'SHUTDOWN' : 'DEPRECATED', ev.shutdown ? '#ff5a3c' : '#ffe9a8', { life: 1.5, max: 1.5, size: ev.shutdown ? 18 : 13, vy: 40 });
        }
        break;
      }
      case 'explosion':
        if (ev.x != null) { explode(ev.x, ev.y, '#ff9a2b', ev.r || 200, true); if (nearCam(ev.x, ev.y)) sfx('hit'); }
        break;
      case 'announce':
        S.announceQ.push({ text: ev.text || '', name: ev.name || '', by: ev.by });
        if (S.announceQ.length > 6) S.announceQ.shift();
        break;
      case 'dodge': {
        const x = ev.x != null ? ev.x : ai ? ai.x : null, y = ev.y != null ? ev.y : ai ? ai.y : null;
        if (x == null) break;
        if (mine) { floater(x, y - 40, 'PERFECT DODGE', '#3df2ff', { size: 20, pop: 1, life: 1.1, max: 1.1, vy: 40 }); sfx('pickup'); buzz([10, 40, 10]); }
        else if (nearCam(x, y)) floater(x, y - 30, 'DODGE', '#3df2ff', { size: 13, life: 0.8, max: 0.8 });
        break;
      }
      case 'dash': {
        const x = ev.x != null ? ev.x : ai ? ai.x : null, y = ev.y != null ? ev.y : ai ? ai.y : null;
        if (x != null && nearCam(x, y)) burst(x, y, 10, ['#3df2ff', '#ffffff'], 200, 0.35, 4, 'spark');
        if (mine) { sfx('itemUse'); buzz(15); }
        break;
      }
      case 'reboot': {
        const x = ev.x != null ? ev.x : ai ? ai.x : null, y = ev.y != null ? ev.y : ai ? ai.y : null;
        if (x != null) reassemble(x, y, ai ? ai.r : 20, ai ? COLORS[ai.c % COLORS.length] : '#3df2ff');
        if (mine) { sfx('reboot'); S.panic = null; }
        break;
      }
      case 'feed': S.feed.unshift({ text: ev.text, t: performance.now() }); S.feed.length = Math.min(S.feed.length, 4); break;
      case 'takeover': sfx('takeover'); break;
      case 'round': sfx('go'); nextRoundMusic(); break;
    }
  }
}

// ---------- interpolation ----------
function lerpState(a, b, t) {
  if (!a || a === b) return b;
  const pa = new Map(a.ais.map((x) => [x.id, x]));
  const ais = b.ais.map((x) => {
    const o = pa.get(x.id);
    return o && Math.hypot(o.x - x.x, o.y - x.y) < 400 ? Object.assign({}, x, { x: o.x + (x.x - o.x) * t, y: o.y + (x.y - o.y) * t }) : x;
  });
  const ba = new Map(a.bullets.map((x) => [x[0], x]));
  const bullets = b.bullets.map((x) => { const o = ba.get(x[0]); return o ? [x[0], o[1] + (x[1] - o[1]) * t, o[2] + (x[2] - o[2]) * t, x[3]] : x; });
  return Object.assign({}, b, { ais, bullets });
}
function netView(now) {
  const s = S.snaps;
  if (!s.length) return null;
  const rt = now - NET_DELAY;
  for (let i = s.length - 1; i > 0; i--) {
    if (s[i - 1].time <= rt) return lerpState(s[i - 1], s[i], Math.min(1, (rt - s[i - 1].time) / Math.max(1, s[i].time - s[i - 1].time)));
  }
  return s[0];
}

// ---------- rendering ----------
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
addEventListener('resize', resize); resize();

function drawSprite(path, x, y, size, tint, t, offset, alpha = 1) {
  const c = spriteCanvas(path, frameOf(path, t, offset), tint);
  if (!c) return false;
  ctx.globalAlpha = alpha;
  ctx.drawImage(c, x - size / 2, y - size / 2, size, size);
  ctx.globalAlpha = 1;
  return true;
}

function render(view, now, dt) {
  const t = (S.clock = (S.clock || 0) + dt);  // animation clock: stops while paused (dt = 0)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, W, H);
  if (!view) return;
  S.lastView = view;

  const me = view.ais.find((a) => a.id === S.meId);
  const arena = G.CONFIG.arena;
  const scale = (Math.max(W, H) / 1150) * (me ? Math.max(0.65, 1 - (me.r - 18) / 140) : 1);
  if (me) { S.camX = me.x; S.camY = me.y; }
  const vw = W / scale, vh = H / scale;
  const cx = vw >= arena ? arena / 2 : Math.max(vw / 2, Math.min(arena - vw / 2, S.camX));
  const cy = vh >= arena ? arena / 2 : Math.max(vh / 2, Math.min(arena - vh / 2, S.camY));
  let sx = 0, sy = 0;
  if (S.shake > 0 && dt > 0) {
    S.shake -= dt;
    const k = Math.min(1, S.shake / 0.25);
    sx = (Math.random() - 0.5) * 2 * S.shakeAmp * k; sy = (Math.random() - 0.5) * 2 * S.shakeAmp * k;
  } else if (dt > 0) S.shakeAmp = 0;
  const decay = Math.pow(0.0005, dt);
  S.kick.x *= decay; S.kick.y *= decay;
  sx -= S.kick.x; sy -= S.kick.y;
  S.cam = { cx, cy, scale };
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * (W / 2 - cx * scale + sx), DPR * (H / 2 - cy * scale + sy));
  ctx.imageSmoothingEnabled = false;
  const x0 = cx - vw / 2, y0 = cy - vh / 2;

  // futuristic floor and walls (background.js); flat grid as fallback
  if (window.Background) window.Background.draw(ctx, { x0, y0, w: vw, h: vh, scale, t, arena, theme: THEME });
  else {
    ctx.strokeStyle = THEME.grid; ctx.lineWidth = 1 / scale;
    ctx.beginPath();
    for (let gx = Math.max(0, Math.floor(x0 / 100) * 100); gx <= Math.min(arena, x0 + vw); gx += 100) { ctx.moveTo(gx, Math.max(0, y0)); ctx.lineTo(gx, Math.min(arena, y0 + vh)); }
    for (let gy = Math.max(0, Math.floor(y0 / 100) * 100); gy <= Math.min(arena, y0 + vh); gy += 100) { ctx.moveTo(Math.max(0, x0), gy); ctx.lineTo(Math.min(arena, x0 + vw), gy); }
    ctx.stroke();
    ctx.strokeStyle = THEME.wall; ctx.lineWidth = 8; ctx.strokeRect(-4, -4, arena + 8, arena + 8);
  }

  const inView = (x, y, m = 80) => x > x0 - m && x < x0 + vw + m && y > y0 - m && y < y0 + vh + m;

  for (const p of S.packets.values()) {
    if (!inView(p.x, p.y)) continue;
    const size = p.v > 1 ? 22 : 15;
    if (!drawSprite('data', p.x, p.y, size, null, t, 0)) { ctx.fillStyle = THEME.ok; ctx.beginPath(); ctx.arc(p.x, p.y, size / 3, 0, 7); ctx.fill(); }
  }
  for (const [, x, y] of view.boxes) {
    if (!inView(x, y, 260)) continue;
    // soft vertical light beam + pulsing beacon ring so boxes read from far away
    const beam = ctx.createLinearGradient(0, y - 260, 0, y);
    beam.addColorStop(0, 'rgba(255,225,77,0)'); beam.addColorStop(1, `rgba(255,225,77,${0.16 + 0.06 * Math.sin(t * 3)})`);
    ctx.fillStyle = beam; ctx.fillRect(x - 16, y - 260, 32, 260);
    for (let k = 0; k < 2; k++) {
      const ph = (t * 0.8 + k * 0.5) % 1;
      ctx.globalAlpha = (1 - ph) * 0.7; ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 22 + ph * 60, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (!drawSprite('promptBox', x, y, 34, null, t, 0)) { ctx.fillStyle = '#ffe14d'; ctx.fillRect(x - 14, y - 14, 28, 28); }
  }
  // bullet trails: a glowing streak behind each bullet, direction from its last drawn position
  const dirs = new Map();
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const [id, x, y, c] of view.bullets) {
    const prev = S.bulletDir.get(id);
    let ux = prev ? prev.ux : 0, uy = prev ? prev.uy : 0;
    if (prev) { const dx = x - prev.x, dy = y - prev.y, d = Math.hypot(dx, dy); if (d > 0.5) { ux = dx / d; uy = dy / d; } }
    dirs.set(id, { x, y, ux, uy });
    if (!inView(x, y) || (!ux && !uy)) continue;
    ctx.strokeStyle = COLORS[c % COLORS.length]; ctx.globalAlpha = 0.55; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x - ux * 30, y - uy * 30); ctx.lineTo(x, y); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.6; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - ux * 16, y - uy * 16); ctx.lineTo(x, y); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  S.bulletDir = dirs;
  for (const [, x, y, c] of view.bullets) {
    if (!inView(x, y)) continue;
    const col = COLORS[c % COLORS.length];
    if (!drawSprite('bullet', x, y, 12, col, t, 0)) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); }
  }
  for (const [, x, y, item] of view.thrown) {
    ctx.shadowColor = '#ff3df0'; ctx.shadowBlur = 20;
    if (!drawSprite('thrown.' + item, x, y, 22, null, t, 0) && !drawSprite('items.' + item, x, y, 28, null, t, 0)) {
      ctx.fillStyle = '#ff3df0'; ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // hallucination ghosts: only on the victim's own screen
  if (me && view.me && view.me.hall) {
    while (S.ghosts.length < 5) S.ghosts.push({ x: me.x + (Math.random() - 0.5) * 900, y: me.y + (Math.random() - 0.5) * 700, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160 });
    for (const gh of S.ghosts) {
      gh.x += gh.vx * dt; gh.y += gh.vy * dt;
      const jx = Math.random() < 0.1 ? (Math.random() - 0.5) * 30 : 0;
      if (!drawSprite('ghost', gh.x + jx, gh.y, 44, null, t, 0, 0.6)) { ctx.globalAlpha = 0.5; ctx.fillStyle = '#b07bff'; ctx.beginPath(); ctx.arc(gh.x, gh.y, 20, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    }
  } else S.ghosts = [];

  // dash afterimages
  if (dt > 0 && now - S.lastAfter > 30) {
    S.lastAfter = now;
    for (const a of view.ais) if (a.k) S.afterimages.push({ x: a.x, y: a.y, r: a.r, c: a.c, life: 0.3, path: bodyPath(a) });
    if (S.afterimages.length > 80) S.afterimages.splice(0, S.afterimages.length - 80);
  }
  for (const g2 of S.afterimages) {
    g2.life -= dt;
    if (g2.life <= 0 || !inView(g2.x, g2.y)) continue;
    const col = COLORS[g2.c % COLORS.length];
    if (!drawSprite(g2.path || 'ai', g2.x, g2.y, g2.r * 2.3, col, t, 0, g2.life * 1.6)) {
      ctx.globalAlpha = g2.life * 1.6; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(g2.x, g2.y, g2.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  S.afterimages = S.afterimages.filter((g2) => g2.life > 0);

  const crownId = view.board && view.board[0] && view.board[0][2] > 0 ? view.board[0][3] : null;
  for (const a of view.ais) {
    if (!inView(a.x, a.y, 120)) continue;
    const col = COLORS[a.c % COLORS.length];
    const size = a.r * 2.3;
    const blink = a.p && Math.floor(t * 10) % 2 === 0;
    if (a.st >= 3) {  // bounty: flickering flame aura
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        const fr = a.r + 12 + Math.random() * 8 + i * 5;
        const gr = ctx.createRadialGradient(a.x, a.y, a.r * 0.6, a.x, a.y, fr);
        gr.addColorStop(0, 'rgba(255,120,20,0)');
        gr.addColorStop(0.7, `rgba(255,${80 + i * 50},20,${0.22 + Math.random() * 0.18})`);
        gr.addColorStop(1, 'rgba(255,60,20,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(a.x, a.y - i * 3, fr, 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    if (a.g) { ctx.shadowColor = col; ctx.shadowBlur = 30; }
    if (!drawSprite(bodyPath(a), a.x, a.y, size, col, t, typeof a.id === 'number' ? a.id * 0.37 : 1, blink ? 0.3 : 1)) {
      ctx.globalAlpha = blink ? 0.3 : 1; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#05060d'; ctx.fillRect(a.x - a.r * 0.6, a.y - a.r * 0.15, a.r * 1.2, a.r * 0.3); ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;
    // status overlays from assets.js (fx), drawn over the body
    const fxA = blink ? 0.4 : 0.75;
    if (a.g) drawSprite('fx:gpuBoost', a.x, a.y, fxSize('gpuBoost', a.r, 2.6), col, t, 0, fxA);
    if (a.f && !drawSprite('fx:firewall', a.x, a.y, fxSize('firewall', a.r, 2.6), col, t, 0, fxA)) {
      ctx.strokeStyle = THEME.accent; ctx.lineWidth = 3; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 8); ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 12, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (a.s) drawSprite('fx:sessionLimit', a.x, a.y, fxSize('sessionLimit', a.r, 2.6), col, t, 0, fxA);
    if (a.h) drawSprite('fx:hallucination', a.x, a.y - 1.5 * a.r, fxSize('hallucination', a.r, 1.6), col, t, 0, 0.85);
    if (a.id === S.meId) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 6 + Math.sin(t * 4) * 2, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    // name with class icon; above it the crown (#1), the session label and the bounty tag
    const fs = Math.max(12, 14 / scale);
    ctx.font = `bold ${fs}px ui-monospace, Menlo, monospace`; ctx.textAlign = 'center';
    ctx.fillStyle = a.id === S.meId ? '#ffffff' : THEME.text;
    ctx.fillText(a.n, a.x, a.y - a.r - 10);
    const nameW = ctx.measureText(a.n).width;
    const ct = CLASS_TAG[a.cl];
    if (!(a.cl && drawSprite('classes.' + a.cl, a.x + nameW / 2 + fs * 0.75, a.y - a.r - 10 - fs * 0.35, fs * 1.05, ct ? ct[1] : col, t, 0)) && ct) {
      ctx.font = `900 ${fs * 0.8}px ui-monospace, monospace`; ctx.fillStyle = ct[1];
      ctx.fillText(ct[0], a.x + nameW / 2 + fs * 0.6, a.y - a.r - 10);
    }
    let lineY = a.y - a.r - 10 - fs * 1.2;  // baseline of the next label above the name
    if (crownId != null && a.id === crownId) {
      const cd = spriteDef('crown');
      if (cd) {
        const cw = fs * 1.9, chh = (cw * cd.frames[0].length) / cd.frames[0][0].length, cy0 = a.y - a.r - 10 - fs * 1.05 - chh / 2;
        const c = spriteCanvas('crown', frameOf('crown', t, 0), '#ffcc33');
        ctx.drawImage(c, a.x - cw / 2, cy0 - chh / 2, cw, chh);
        lineY = cy0 - chh / 2 - fs * 0.15;
      } else {
        ctx.font = `900 ${fs * 1.1}px ui-monospace, monospace`; ctx.fillStyle = '#ffcc33'; ctx.fillText('♛', a.x, lineY); lineY -= fs * 1.15;
      }
    }
    if (a.s) { ctx.fillStyle = '#3df2ff'; ctx.font = `bold ${fs * 0.9}px ui-monospace, monospace`; ctx.fillText('Session limit reached', a.x, lineY); lineY -= fs * 1.1; }
    if (a.st >= 3) {
      ctx.font = `900 ${fs * 0.8}px ui-monospace, monospace`; ctx.fillStyle = '#ffcc33';
      ctx.fillText(`BOUNTY ×${a.st}`, a.x, lineY);
    }
    const bw = Math.max(36, a.r * 2), bh = 5;
    ctx.fillStyle = '#16223a'; ctx.fillRect(a.x - bw / 2, a.y + a.r + 8, bw, bh);
    ctx.fillStyle = a.hp / a.mhp > 0.35 ? THEME.ok : THEME.danger; ctx.fillRect(a.x - bw / 2, a.y + a.r + 8, bw * Math.max(0, a.hp / a.mhp), bh);
  }

  // focus reticle on the targeted AI
  const focusId = view.me && view.me.focus != null ? view.me.focus : S.focusLocal;
  const ft = focusId ? view.ais.find((a) => a.id === focusId) : null;
  if (ft) {
    const rr = ft.r + 16 + Math.sin(t * 8) * 3;
    ctx.save(); ctx.translate(ft.x, ft.y); ctx.rotate(t * 1.5);
    ctx.strokeStyle = '#ff3b4e'; ctx.lineWidth = 3; ctx.globalAlpha = 0.85;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.arc(0, 0, rr, -0.35, 0.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rr + 4, 0); ctx.lineTo(rr + 12, 0); ctx.stroke();
    }
    ctx.restore();
  }

  // particles: smoke and debris normally, glow/sparks/fragments additively
  for (const p of S.particles) {
    p.life -= dt;
    if (p.kind === 'conv') {
      const e = 1 - Math.max(0, p.life / p.max), k = 1 - (1 - e) ** 3;
      p.x = p.sx + (p.tx - p.sx) * k; p.y = p.sy + (p.ty - p.sy) * k;
      continue;
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const drag = Math.pow(p.kind === 'smoke' ? 0.08 : 0.02, dt);
    p.vx *= drag; p.vy *= drag;
  }
  S.particles = S.particles.filter((p) => p.life > 0);

    view = lerpState(S.prev, S.cur, S.paused ? 1 : S.acc / TICK);
  } else if (S.mode === 'multi') {
    sendInput(now);
    view = netView(now);
  }
  if (S.cur && S.cur.me) {
    if (S.cur.me.xp > S.lastXp) {
      const a = view && view.ais.find((x) => x.id === S.meId);
      if (a) floater(a.x + 20, a.y - a.r, `+${S.cur.me.xp - S.lastXp} XP`, THEME.ok);
      if (S.countLifetime) addLifetime(S.cur.me.xp - S.lastXp);
    }
    S.lastXp = S.cur.me.xp;
  }
  if (S.paused) {  // freeze wall-clock timers while paused
    const ms = dt * 1000;
    S.announceUntil += ms; S.msgUntil += ms;
    for (const f of S.feed) f.t += ms;
    if (S.panic) S.panic.start += ms;
    if (S.burstAt) S.burstAt += ms;
  }
  $('announce').style.animationPlayState = S.paused ? 'paused' : 'running';
  if (S.burstAt && now >= S.burstAt) { S.burstAt = 0; levelBurst(); }
  render(view, now, S.paused ? 0 : dt);
  if (S.mode) drawBoxPointers(view);
  if (S.mode) drawJoystick(dt);
  if (S.mode) updateHud(view, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
